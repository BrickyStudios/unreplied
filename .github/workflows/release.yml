name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v1.2.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write # create the GitHub release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore
        run: |
          test -n "${{ secrets.KEYSTORE_BASE64 }}" || { echo "KEYSTORE_BASE64 secret missing"; exit 1; }
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.jks

      - name: Unit tests
        run: ./gradlew testOfflineDebugUnitTest testUpdatesDebugUnitTest

      - name: Build both release APKs
        run: ./gradlew assembleOfflineRelease assembleUpdatesRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

      - name: Rename APKs
        run: |
          # same names in every release, so releases/latest/download/<name> always works and the updater finds its file
          mkdir -p out
          mv app/build/outputs/apk/offline/release/app-offline-release.apk out/Unreplied.apk
          mv app/build/outputs/apk/updates/release/app-updates-release.apk out/Unreplied-Updates.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: Unreplied ${{ steps.tag.outputs.value }}
          body: |
            Two downloads, same app (Android 8.0 or newer, runs on GrapheneOS without Google services):
            - `Unreplied.apk`: no internet permission at all. Updates through Obtainium (filter `^Unreplied\.apk$`).
            - `Unreplied-Updates.apk`: checks GitHub for new versions and installs them; the internet is used for nothing else.
            Both are signed with the same key, so you can switch by installing the other one over it.

            Zwei Downloads, dieselbe App: `Unreplied.apk` ganz ohne Internet (Updates über Obtainium), `Unreplied-Updates.apk` aktualisiert sich selbst über GitHub und nutzt das Internet für nichts anderes.
          files: |
            out/Unreplied.apk
            out/Unreplied-Updates.apk
          draft: false
          prerelease: false
